services:
  atria2api:
    build: .
    image: atria2api:latest
    container_name: atria2api
    restart: unless-stopped
    ports:
      - "8318:8318"
    volumes:
      # 可写：面板增删 key、改模型、换代理池都会回写这个文件。
      - ./config.yaml:/app/config.yaml
      # 用量和 key 冷却状态，和配置文件分开，避免卷盖住 /app。
      - atria2api-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8318/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  atria2api-state:
