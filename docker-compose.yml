services:
  atria2api:
    build: .
    image: atria2api:latest
    container_name: atria2api
    restart: unless-stopped
    ports:
      - "8318:8318"
    environment:
      # 部署时唯一必填项。没设密码进程会拒绝启动。
      ATRIA2API_MGMT_KEY: ${ATRIA2API_MGMT_KEY:?set ATRIA2API_MGMT_KEY to the panel password}
    volumes:
      # 没有这个文件时，程序会用示例配置自动生成。必须可写，面板会回写它。
      - ./config.yaml:/app/config.yaml
      # 用量和 key 冷却状态，和配置文件分开，避免卷盖住 /app。
      - atria2api-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8318/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  atria2api-state:
