services:
  atria2api:
    build: .
    image: atria2api:latest
    container_name: atria2api
    restart: unless-stopped
    ports:
      - "8318:8318"
    environment:
      # 第一次启动可以不改文件：上游密钥、面板密码、是否允许远程登录都走环境变量。
      ATRIA2API_KEYS: ${ATRIA2API_KEYS:-}
      ATRIA2API_API_KEYS: ${ATRIA2API_API_KEYS:-}
      ATRIA2API_MGMT_KEY: ${ATRIA2API_MGMT_KEY:-}
      ATRIA2API_ALLOW_REMOTE: ${ATRIA2API_ALLOW_REMOTE:-}
    volumes:
      # 没有这个文件时，程序会用示例配置自动生成。必须可写，面板会回写它。
      - ./config.yaml:/app/config.yaml
      # 用量和 key 冷却状态，和配置文件分开，避免卷盖住 /app。
      - atria2api-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8318/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  atria2api-state:
