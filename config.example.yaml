# atria2api configuration. Copy to config.yaml and fill in your atr_ keys.
# Docs: https://api.atria-asi.ai/docs   Upstream base URL is fixed for all
# three interfaces, so you only need to add keys below.

host: ""          # bind address; "" = all interfaces, "127.0.0.1" = local only
port: 8318

tls:
  enable: false
  cert: ""
  key: ""

# Keys clients use to call THIS gateway (downstream auth). Leave empty to run
# an open gateway (not recommended when exposed to the internet).
api-keys:
  - "gw-change-me-1"
  - "gw-change-me-2"

# The single Atria API endpoint. Keys are rotated by the pool below.
upstream:
  base-url: "https://api.atria-asi.ai"
  default-model: "Atria-Dawn-Preview"
  # Rewrite every request's "model" to default-model (Atria exposes one model;
  # keeps clients that hardcode a different id working).
  force-model: true
  timeout: 10m
  connect-timeout: 15s
  # One or more atr_ keys. Weight drives the weighted round-robin pick.
  keys:
    - key: "atr_replace_me_1"
      weight: 1
      # proxy: ""            # optional per-key override: a socks5:// URL, or "none"
    - key: "atr_replace_me_2"
      weight: 1

# SOCKS5 egress pool. Leave the list empty for direct connections.
# Atria rate limits are per account; different egress IPs do not raise the
# limit, but a proxy pool keeps your server IP off the upstream's radar and
# lets a key keep working from a clean address after an IP-level block.
proxy:
  policy: "round-robin"   # round-robin | random | sticky-key (sticky per key id)
  health-every: 30s
  fail-cooldown: 30s
  socks5:
    - url: "socks5://user:pass@1.2.3.4:1080"
    # - url: "socks5://h.t.d:1080"

# Rate-limit handling, retries and cooldowns (upstream sends these headers on
# 429: Retry-After, x-rpm-limit, x-rpm-remaining; see the docs section
# "速率限制").
rate-limit:
  respect-header: true      # parse x-rpm-* / Retry-After
  min-rpm-reserve: 1        # skip a key with fewer remaining requests than this
  cooldown-429: 60s         # used when the upstream sends no Retry-After
  cooldown-5xx: 30s
  err-threshold: 3          # consecutive errors before a key is cooled down
  err-cooldown: 10m
  disable-on-401: true      # a 401 means the key is invalid or revoked
  max-retries: 3            # cross-key retries per request
  retry-on: [429, 500, 502, 503, 504]
  backoff: 1s               # base retry backoff (exponential, +/-25% jitter)

log:
  level: "info"             # debug | info | warn | error
  format: "text"            # text | json

# Usage counters + pool state persistence (atomic tmp+rename writes).
metrics:
  enabled: true
  state-file: "state.json"
  flush-every: 5s

# Management API (/v0/management/*). Empty secret-key disables it (404).
remote-management:
  # false = management panel and API only accept loopback (127.0.0.1) clients.
  # Set true to expose the panel on the public internet; combine with a strong
  # secret-key. Same as env ATRIA2API_ALLOW_REMOTE=1.
  allow-remote: false
  # Panel login password and management-API credential. Independent from the
  # api-keys above (those are what your clients call the gateway with); a
  # downstream key cannot log into the panel and this cannot call /v1/*.
  # Env override: ATRIA2API_MGMT_KEY. Empty = whole group returns 404.
  secret-key: ""
