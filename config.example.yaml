# atria2api configuration. Copy to config.yaml and fill in your atr_ keys.
# Docs: https://api.atria-asi.ai/docs   Upstream base URL is fixed for all
# three interfaces, so you only need to add keys below.

host: ""          # bind address; "" = all interfaces, "127.0.0.1" = local only
port: 8318

tls:
  enable: false
  cert: ""
  key: ""

# Keys clients use to call THIS gateway (downstream auth). Leave the list
# empty for an open gateway, then add real keys from the panel. Do not ship
# placeholder values: a client using them would just get 401.
api-keys: []

# The single Atria API endpoint. Keys are rotated by the pool below.
upstream:
  base-url: "https://api.atria-asi.ai"
  default-model: "Atria-Dawn-Preview"
  # Rewrite every request's "model" to default-model (Atria exposes one model;
  # keeps clients that hardcode a different id working).
  force-model: true
  timeout: 10m
  connect-timeout: 15s
  # One or more atr_ keys. Leave empty and add them from the panel, or set
  # ATRIA2API_KEYS=atr_xxx,atr_yyy. Weight drives the weighted round-robin pick.
  keys: []
    # - key: "atr_xxx"
    #   weight: 1
    #   proxy: ""            # optional per-key override: a socks5:// URL, or "none"

# SOCKS5 egress pool. Leave the list empty for a direct connection.
# Add nodes from the panel, or uncomment a real socks5:// URL below.
# Atria rate limits are per account; a different egress IP does not raise them.
proxy:
  policy: "round-robin"   # round-robin | random | sticky-key (sticky per key id)
  health-every: 30s
  fail-cooldown: 30s
  socks5: []
    # - url: "socks5://user:pass@1.2.3.4:1080"

# Rate-limit handling, retries and cooldowns (upstream sends these headers on
# 429: Retry-After, x-rpm-limit, x-rpm-remaining; see the docs section
# "速率限制").
rate-limit:
  respect-header: true      # parse x-rpm-* / Retry-After
  min-rpm-reserve: 1        # skip a key with fewer remaining requests than this
  cooldown-429: 60s         # used when the upstream sends no Retry-After
  cooldown-5xx: 30s
  err-threshold: 3          # consecutive errors before a key is cooled down
  err-cooldown: 10m
  disable-on-401: true      # a 401 means the key is invalid or revoked
  max-retries: 3            # cross-key retries per request
  retry-on: [429, 500, 502, 503, 504]
  backoff: 1s               # base retry backoff (exponential, +/-25% jitter)

log:
  level: "info"             # debug | info | warn | error
  format: "text"            # text | json

# Usage counters + pool state persistence (atomic tmp+rename writes).
metrics:
  enabled: true
  state-file: "state/state.json"
  flush-every: 5s

# Management panel (/v0/management/panel). The password is the only value
# required before the process will start. Set it here, or with ATRIA2API_MGMT_KEY.
# Everything else (upstream keys, client keys, proxies) can be filled in
# from the panel after it is up.
remote-management:
  # true so a browser on another machine can open the panel right after deploy.
  # Set false only when you will log in from the same machine.
  allow-remote: true
  # Panel login password. Independent from api-keys: a downstream key cannot
  # log into the panel, and this password cannot call /v1/*.
  secret-key: ""
